# fly.toml app configuration file generated for ece1779-project-online-gaming-platform on 2025-10-28T18:53:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ece1779-project-online-gaming-platform'
primary_region = 'yyz'

[build]
  dockerfile = './Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[metrics]
port = 8080
path = "/metrics"

